[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bidbrief"
version = "1.0.0"
description = "Reads a public construction bid package and gives an estimator a cited one-page brief, bid items, risks and answers."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ashish Joshi" }]
dependencies = [
  "pymupdf>=1.24,<2", "pdfplumber>=0.11", "rapidfuzz>=3.6", "rank-bm25>=0.2.2", "numpy>=1.26",
  "pandas>=2.1", "openpyxl>=3.1", "pydantic>=2.6,<3", "pillow>=10", "python-dotenv>=1.0", "requests>=2.31",
  "google-genai>=1.20", "fastembed>=0.4", "faiss-cpu>=1.8",
  "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ocr = ["ocrmypdf>=16"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["bidbrief"]

[tool.setuptools.package-data]
bidbrief = ["web/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
